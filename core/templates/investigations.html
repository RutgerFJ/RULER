{% extends "base.html" %}

{% block title %}RULER | Investigations{% endblock %}

{% block content %}
<div class="p-8">
    <!-- Investigations Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
        <h1 class="text-4xl font-bold">Investigations</h1>
        <a href="{% url 'create_investigation' step=1 %}" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            Create New Investigation
        </a>
    </div>

    <!-- Filter/Search Bar -->
    <div class="card bg-base-100 border-[1px] border-base-300 shadow-sm p-4 mb-6">
        <form method="GET" action="{% url 'investigations' %}" class="flex gap-4 items-end">
            
            <!-- Maintain existing sort values if user filters -->
            <input type="hidden" name="sort_by" value="{{ sort_by }}">
            <input type="hidden" name="sort_order" value="{{ sort_order }}">

            <!-- Name Search -->
            <div class="form-control w-full">
                <label class="label py-1 text-xs font-semibold uppercase text-base-content/60">Search Name</label>
                <input type="text" name="search_name" value="{{ search_name }}" placeholder="Type name..." class="input input-bordered w-full input-sm focus:input-primary" />
            </div>

            <!-- Status Filter -->
            <div class="form-control w-full">
                <label class="label py-1 text-xs font-semibold uppercase text-base-content/60">Status</label>
                <select name="filter_status" class="select select-bordered select-sm w-full focus:select-primary">
                    <option value="">All Statuses</option>
                    <option value="active" {% if filter_status == 'active' %}selected{% endif %}>Active</option>
                    <option value="paused" {% if filter_status == 'paused' %}selected{% endif %}>Paused</option>
                    <option value="completed" {% if filter_status == 'completed' %}selected{% endif %}>Completed</option>
                    <option value="archived" {% if filter_status == 'archived' %}selected{% endif %}>Archived</option>
                </select>
            </div>

            <!-- Date From -->
            <div class="form-control w-full">
                <label class="label py-1 text-xs font-semibold uppercase text-base-content/60">Created From</label>
                <input type="date" name="filter_date_from" value="{{ filter_date_from }}" class="input input-bordered input-sm w-full focus:input-primary" />
            </div>

            <!-- Date To -->
            <div class="form-control w-full">
                <label class="label py-1 text-xs font-semibold uppercase text-base-content/60">Created To</label>
                <input type="date" name="filter_date_to" value="{{ filter_date_to }}" class="input input-bordered input-sm w-full focus:input-primary" />
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-2">
                <button type="submit" class="btn btn-primary btn-sm flex-1">
                    Filter
                </button>
                <a href="{% url 'investigations' %}" class="btn btn-ghost btn-sm btn-outline border-base-300 flex-1">
                    Reset
                </a>
            </div>
        </form>
    </div>

    <!-- Investigations Table Container -->
    <div id="investigations-table" class="card border-[1px] border-base-300 bg-base-100 shadow-sm">
        {% include "partials/investigations_table.html" %}
    </div>
</div>
{% endblock %}
