[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rutger-mlva"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "biopython==1.86",
    "django==6.0.3",
    "pytest>=9.0.2",
    "regex>=2026.3.32",
    "django-rq==3.1.0",
    "redis==5.0.1",
    "gunicorn==23.0.0",
    "rq==2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core", "mlva*", "tests"]
